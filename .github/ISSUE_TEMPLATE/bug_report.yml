name: Bug report
description: Something in Kuana doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The more precise the steps, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with …
        2. Press …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kuana version
      description: "About Kuana → Copy Version (the version and the commit it was built from)."
      placeholder: "Kuana 0.2.0 (abc1234)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.1, Windows 11 24H2, Ubuntu 24.04 (Wayland)…"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or files
      description: Anything else that helps, such as a screenshot or the file that triggers it.
