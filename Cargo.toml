[package]
name = "kin"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.bundle]
name = "Kin"
identifier = "dev.kin.editor"
icon = ["assets/app-icon/macos/Kin.icns", "assets/app-icon/linux/hicolor/*/apps/dev.kin.editor.png"]
category = "public.app-category.developer-tools"
short_description = "A small, fast GPU-rendered code editor"

[package.metadata.bundle.osx]
# Lets Finder offer Kin in Open With for folders and files (Alternate: never the default app).
info_plist_exts = ["assets/macos/document-types.plist"]

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
futures = "0.3.34"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Image dimensions for previews (GPUI already depends on it, with its formats).
image = { version = "0.25", default-features = false }
ignore = "0.4.33"
# Extensions' tree-sitter grammars, compiled to libraries and loaded at run time.
libloading = "0.8"
# Checks that an update's manifest was signed by the release workflow.
minisign-verify = "0.3"
nucleo-matcher = "0.3.1"
oxc_allocator = "0.139.0"
oxc_ast = "0.139.0"
oxc_diagnostics = "0.139.0"
oxc_parser = "0.139.0"
oxc_semantic = "0.139.0"
oxc_span = "0.139.0"
oxc_syntax = "0.139.0"
regex = "1.13.1"
ropey = "1.6"
rumdl = { version = "0.2.79", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2.0"
toml = "0.8"
trash = "5"
tree-sitter = { version = "0.26.13", features = ["wasm"] }
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
url = "2.5.8"
notify = "8"
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
# setsid for the login shell that reports PATH, so it can't take over Kin's terminal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
