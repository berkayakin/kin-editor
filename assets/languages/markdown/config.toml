name = "Markdown"
grammar = "markdown"
path_suffixes = ["md", "markdown", "mdown", "mkd"]
block_comment = { start = "<!--", end = "-->" }
# Kuana's key: prose reads better wrapped.
soft_wrap = true

[queries]
highlights = ["crate:markdown/highlights"]
injections = ["crate:markdown/injections", "injections.scm"]
